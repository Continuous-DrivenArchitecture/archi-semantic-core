name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # OIDC for npm trusted publishing + provenance attestations

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The main ruleset blocks every direct push except for the
      # cda-release-sentinel app (the GITHUB_TOKEN cannot be a ruleset
      # bypass actor). Mint a short-lived installation token and use it
      # for checkout + the semantic-release push of the chore(release)
      # commit and version tags.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # dist/ is gitignored, so a clean checkout has no build output. The
      # artifact must be built explicitly BEFORE semantic-release: the npm
      # publish never runs prepublishOnly because .npmrc sets
      # ignore-scripts=true (which also keeps npm ci deterministic).
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Strong pre-publish guard: `npm pack --dry-run` must list dist/ files
      # in the exact payload npm would publish. Fails the release before any
      # broken tarball can reach the registry.
      - name: Validate publishable payload
        run: node scripts/verify-pack.mjs
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Attribute the chore(release) commit to a human maintainer
          # instead of the default @semantic-release-bot identity.
          GIT_AUTHOR_NAME: Miguel Cespedes
          GIT_AUTHOR_EMAIL: miguelcespedes@outlook.com
          GIT_COMMITTER_NAME: Miguel Cespedes
          GIT_COMMITTER_EMAIL: miguelcespedes@outlook.com
      # Guard: the release commit must be authored by the human
      # maintainer, never by a bot identity. If the identity env vars
      # above are ever removed or overridden, this fails the workflow
      # instead of silently polluting the contributor graph again.
      - name: Verify release commit author
        run: |
          author="$(git log -1 --format='%an <%ae>')"
          expected="Miguel Cespedes <miguelcespedes@outlook.com>"
          if [ "$author" != "$expected" ]; then
            echo "::error::release commit authored by '$author', expected '$expected'" >&2
            exit 1
          fi