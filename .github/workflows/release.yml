name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # OIDC for npm trusted publishing + provenance attestations

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Attribute the chore(release) commit to a human maintainer
          # instead of the default @semantic-release-bot identity.
          GIT_AUTHOR_NAME: Miguel Cespedes
          GIT_AUTHOR_EMAIL: miguelcespedes@outlook.com
          GIT_COMMITTER_NAME: Miguel Cespedes
          GIT_COMMITTER_EMAIL: miguelcespedes@outlook.com