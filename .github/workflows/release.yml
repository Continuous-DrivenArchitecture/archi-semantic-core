name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # OIDC for npm trusted publishing + provenance attestations

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The main ruleset blocks every direct push except for the
      # cda-release-sentinel app (the GITHUB_TOKEN cannot be a ruleset
      # bypass actor). Mint a short-lived installation token and use it
      # for checkout + the semantic-release push of the chore(release)
      # commit and version tags.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Attribute the chore(release) commit to a human maintainer
          # instead of the default @semantic-release-bot identity.
          GIT_AUTHOR_NAME: Miguel Cespedes
          GIT_AUTHOR_EMAIL: miguelcespedes@outlook.com
          GIT_COMMITTER_NAME: Miguel Cespedes
          GIT_COMMITTER_EMAIL: miguelcespedes@outlook.com