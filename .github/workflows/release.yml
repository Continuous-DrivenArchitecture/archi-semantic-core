name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write # OIDC for npm trusted publishing + provenance attestations

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # CDA Model B: main is immutable during release -- semantic-release
      # never pushes a release commit back to main (no @semantic-release/git),
      # so the ordinary, ephemeral GITHUB_TOKEN is sufficient for the tag
      # push and GitHub Release creation. No bypass identity needed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # dist/ is gitignored, so a clean checkout has no build output. The
      # artifact must be built explicitly BEFORE semantic-release: the npm
      # publish never runs prepublishOnly because .npmrc sets
      # ignore-scripts=true (which also keeps npm ci deterministic).
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Strong pre-publish guard: `npm pack --dry-run` must list dist/ files
      # in the exact payload npm would publish. Fails the release before any
      # broken tarball can reach the registry.
      - name: Validate publishable payload
        run: node scripts/verify-pack.mjs
      # No NPM_TOKEN: publishes via npm Trusted Publishing (OIDC), using the
      # id-token: write permission above. Requires this repository +
      # workflow file to be registered as a Trusted Publisher on the
      # @cda/archi-semantic-core package on npmjs.com (Package settings ->
      # Trusted Publisher).
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
