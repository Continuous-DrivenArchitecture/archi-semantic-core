name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run badges
        env:
          CI: true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Audits the production dependency tree (the only deps that ship to
      # consumers). Dev-only tooling is excluded: its reported issues are
      # inside npm's own bundled dependencies (tar, brace-expansion,
      # ip-address, undici) pulled in via @semantic-release/npm, which are
      # not fixable from this repo and never reach the published package.
      - run: npm audit --omit=dev --audit-level=high