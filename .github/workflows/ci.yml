name: CI
# CDA Phase 5 verification: re-checked 2026-08-23 under allowed_actions=selected, sha_pinning_required=true, ruleset ci-required + strict.

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Validates the exact payload npm would publish (dist/ present in the
      # tarball). Prevents the "source OK / CI green / broken npm tarball"
      # situation from ever reaching a release.
      - run: node scripts/verify-pack.mjs
      - run: npm test
      # Consumes the packed tarball from a fresh fixture project: verifies
      # the export map (root + ./archive), runtime imports and the
      # published .d.ts types under every supported Node major.
      - run: npm run test:published
      - run: npm run badges
        env:
          CI: true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Audits the production dependency tree (the only deps that ship to
      # consumers). Dev-only tooling is excluded: its reported issues are
      # inside npm's own bundled dependencies (tar, brace-expansion,
      # ip-address, undici) pulled in via @semantic-release/npm, which are
      # not fixable from this repo and never reach the published package.
      - run: npm audit --omit=dev --audit-level=high

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm sbom --sbom-format=spdx --omit=dev > sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error

  # Stable, matrix-independent required status check (CDA npm Library
  # Profile v1): the Protect main ruleset targets ONLY this job's name.
  # Adding/removing a Node version in the `validate` matrix never requires
  # touching the ruleset's required-checks list -- only this job's
  # `needs:` array changes. `needs: [validate]` alone already waits for
  # every matrix leg (GitHub Actions requires all instances of a matrix
  # job to complete before a dependent job runs), so the legs are not
  # enumerated individually here.
  ci-required:
    runs-on: ubuntu-latest
    if: always()
    needs: [validate, audit, sbom]
    steps:
      - name: Verify every required job succeeded
        run: |
          for result in \
            "${{ needs.validate.result }}" \
            "${{ needs.audit.result }}" \
            "${{ needs.sbom.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::at least one required job did not succeed"
              exit 1
            fi
          done
          echo "All required CI jobs passed."