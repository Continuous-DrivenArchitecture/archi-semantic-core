name: Dependency health

on:
  schedule:
    - cron: '0 3 * * 1' # weekly, Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails the run when any dependency is out of date, surfacing drift
      # in the Actions tab once a week (OWASP npm cheat sheet §4). Review
      # `npm outdated` output, then upgrade deliberately: changelog first,
      # never blindly.
      - run: npm outdated